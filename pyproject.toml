[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite",
  "langchain>=1.1",
  "langchain-xai",
  "pydantic>=2",
  "pdfplumber",
  "python-dateutil",
  "rapidfuzz",
  "python-dotenv",
  "rich",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["invoice_agent", "invoice_agent.ingest"]

[tool.pytest.ini_options]
markers = ["live: calls the real xAI API"]
addopts = "-m 'not live'"
